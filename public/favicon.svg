<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Left Page Gradient -->
    <linearGradient id="notelyBookLeft" x1="8" y1="11" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- Right Page Gradient -->
    <linearGradient id="notelyBookRight" x1="40" y1="11" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Ribbon Gradient -->
    <linearGradient id="notelyRibbon" x1="18" y1="10" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="notelyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Page & Spine -->
  <path
    d="M24 38V12C21 9 15 9 8 11V37C15 35 21 35 24 38Z"
    fill="url(#notelyBookLeft)"
    stroke="#1D4ED8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#notelyShadow)"
  />

  <!-- Right Page -->
  <path
    d="M24 38V12C27 9 33 9 40 11V37C33 35 27 35 24 38Z"
    fill="url(#notelyBookRight)"
    stroke="#1D4ED8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#notelyShadow)"
  />

  <!-- Reading Text Lines Left Page -->
  <line x1="12" y1="20" x2="20" y2="18.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="26" x2="20" y2="24.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Reading Text Lines Right Page -->
  <line x1="28" y1="18.5" x2="36" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="24.5" x2="36" y2="26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Bookmark Ribbon -->
  <path
    d="M24 12V24L21 21.5L18 24V10.5"
    fill="url(#notelyRibbon)"
    stroke="#1D4ED8"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
